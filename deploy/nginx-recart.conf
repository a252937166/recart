server {
    listen 80;
    listen [::]:80;
    server_name recart.example.com;
    location /.well-known/acme-challenge/ { root /var/www/recart-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recart.example.com;

    ssl_certificate     /etc/letsencrypt/live/recart.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recart.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSLRECART:10m;
    ssl_session_timeout 1d;

    client_max_body_size 128k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/events {
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # the real client only; a client-sent list is dropped here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Merchant API: catalog and stock batches may be up to 2 MB.
    location /v1/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # the real client only; a client-sent list is dropped here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;  # POST /v1/requirement-drafts waits on the language providers; see /api/ below
    }

    # Demo API. POST /api/goal/extract waits on the language providers: the primary up to CODEX_DEADLINE_SECONDS
    # (100 s) plus 15 s transport grace, a 5 s status probe, the 15 s backup, and 5 s to record and answer: 140 s.
    # /api/health reports that figure as language.worstCaseSeconds; this timeout, /v1/ and /mcp must stay above it.
    # /api/events (above) is a longer prefix, so nginx keeps routing the event stream there with its own settings.
    location /api/ {
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # the real client only; a client-sent list is dropped here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }

    # Remote MCP server (Streamable HTTP). Unbuffered so streamed responses pass through unchanged.
    location = /mcp {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # the real client only; a client-sent list is dropped here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;  # the draft_requirements tool waits on the language providers like /api/ above
    }

    location / {
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # the real client only; a client-sent list is dropped here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
